<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>我的成长面板 · Progress View</title>
  <style>
    :root{--navy:#101b35;--navy2:#192b50;--blue:#5f82c8;--peach:#f3b7a9;--paper:#fbfcff;--ink:#18233a;--muted:#6e7890;--line:#dfe5f0;--panel:#f2f5fb;--ok:#16785c}
    *{box-sizing:border-box}
    html,body{margin:0;background:#edf1f8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
    button{font:inherit}
    .bar{position:sticky;top:0;z-index:10;background:linear-gradient(90deg,#0f1b35,#17294e);color:#fff;display:flex;align-items:center;gap:14px;padding:14px 26px;box-shadow:0 10px 30px rgba(10,20,45,.25)}
    .who{display:flex;gap:11px;align-items:center}
    .who img{width:40px;height:40px;border-radius:13px;object-fit:cover;border:1px solid #ffffff55}
    .who b{display:block;font-size:13px}
    .who span{display:block;font-size:10px;color:#94a5c5;letter-spacing:.08em;margin-top:2px}
    .bar-right{margin-left:auto;display:flex;gap:9px;align-items:center}
    .tag{font-size:10.5px;color:#9fe3c8;border:1px solid #9fe3c84d;border-radius:999px;padding:5px 11px}
    .tag.warn{color:#f3b7a9;border-color:#f3b7a94d}
    .bar-right a{border:1px solid #ffffff24;background:#ffffff0d;color:#dbe4f5;border-radius:10px;padding:8px 13px;font-size:11.5px;cursor:pointer;text-decoration:none;font-weight:700}
    .bar-right a:hover{background:#ffffff1c}
    main{max-width:1060px;margin:0 auto;padding:30px 22px 90px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:26px}
    .stat{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:19px 19px 16px}
    .stat small{display:block;font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:800;margin-bottom:9px}
    .stat b{display:block;font-family:Georgia,serif;font-size:29px;color:#152344;line-height:1}
    .stat span{display:block;font-size:10.5px;color:var(--muted);margin-top:7px}
    .stat.hot b{color:#16785c}
    section h2{font-family:Georgia,"Songti SC",serif;font-size:19px;margin:30px 0 14px;color:#152344}
    section h2 small{font-family:-apple-system,"PingFang SC",sans-serif;font-size:10.5px;color:var(--muted);font-weight:500;margin-left:8px}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:22px}
    .pipe{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:stretch}
    .pipe-stage{border-radius:14px;padding:16px;text-align:center}
    .pipe-stage b{display:block;font-family:Georgia,serif;font-size:30px;line-height:1}
    .pipe-stage span{display:block;font-size:10.5px;color:var(--muted);margin-top:6px}
    .pipe-arrow{display:grid;place-items:center;color:#aeb9cf;font-size:17px}
    .chart svg{display:block;width:100%;height:auto}
    .chart .empty{color:var(--muted);font-size:12.5px;text-align:center;padding:26px 0}
    .arsenal{display:grid;grid-template-columns:1fr 1fr;gap:13px}
    .arsenal-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
    .arsenal-card b{display:block;font-family:Georgia,serif;font-size:15px;color:#152344}
    .arsenal-card small{display:block;color:var(--muted);font-size:10.5px;margin-top:6px}
    .badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
    .badge-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:17px 18px;display:flex;gap:13px;align-items:center}
    .badge-card.locked{opacity:.45;filter:grayscale(.9)}
    .badge-ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex:none;background:#0f1b35;color:#ffd45a}
    .badge-card b{display:block;font-family:Georgia,serif;font-size:14px;color:#152344}
    .badge-card span{display:block;font-size:10.5px;color:var(--muted);margin-top:4px}
    .empty{background:var(--paper);border:1px dashed var(--line);border-radius:16px;padding:34px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.8}
    .foot{margin-top:34px;text-align:center;color:#9aa4b8;font-size:10.5px;line-height:1.7}
    @media(max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}.badge-grid{grid-template-columns:1fr}.arsenal{grid-template-columns:1fr}.bar{padding:12px 15px}.pipe{grid-template-columns:1fr;gap:4px}.pipe-arrow{transform:rotate(90deg)}}
  </style>
</head>
<body>
  <header class="bar">
    <div class="who"><img src="assets/rising-star.jpg" alt="廖同学"><div><b>我的成长面板</b><span>PROGRESS VIEW · 学生视角</span></div></div>
    <div class="bar-right"><span class="tag" id="syncTag">本地数据</span><a href="index.html">← 返回学习室</a></div>
  </header>
  <main>
    <div class="stats" id="stats"></div>
    <section><h2>词汇流转管道 <small>查词 → 复习中 → 已毕业</small></h2><div class="card" id="pipe"></div></section>
    <section><h2>净读速度 <small>目标带 120–150 wpm（MBE 阅读节奏）</small></h2><div class="card chart" id="wpm"></div></section>
    <section><h2>复述术语准确率 <small>AI 批改 · 按页</small></h2><div class="card chart" id="acc"></div></section>
    <section><h2>表达兵器库 <small id="arsenalCount"></small></h2><div id="arsenal"></div></section>
    <section><h2>徽章墙 <small id="badgeCount"></small></h2><div class="badge-grid" id="badges"></div></section>
    <div class="foot">数据来自你的学习记录（本地 + 云同步）。继续查词、复习、复述，这里会自动更新。</div>
  </main>
  <script src="assets/supabase-config.js?v=20260825-t2"></script>
  <script src="assets/cloud-sync.js?v=20260825-t2"></script>
  <script type="module">
    import {BADGES,streakDays} from './assets/badges.js?v=20260825';
    (function(){
      var $=function(s){return document.querySelector(s)};
      var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
      function stat(label,value,sub,extra){return '<div class="stat '+(extra||'')+'"><small>'+label+'</small><b>'+value+'</b><span>'+sub+'</span></div>'}
      function lineChart(points,opt){
        // points: [{x:label,y:number}] 已按序；opt:{min,max,band:[lo,hi],fmt}
        if(!points.length)return '<div class="empty">还没有数据——完成一次记录后这里会出现曲线。</div>';
        var W=680,H=230,P=44;
        var max=opt.max,min=opt.min;
        var xs=function(i){return points.length===1?W/2:P+i*(W-2*P)/(points.length-1)};
        var ys=function(v){return H-P-(v-min)/(max-min)*(H-2*P)};
        var grid='',labels='';
        for(var g=0;g<=4;g++){
          var v=min+(max-min)*g/4,y=ys(v);
          grid+='<line x1="'+P+'" x2="'+(W-8)+'" y1="'+y+'" y2="'+y+'" stroke="#edf0f5"/>';
          labels+='<text x="'+(P-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="#9aa4b8">'+Math.round(v)+'</text>';
        }
        var band='';
        if(opt.band){
          var y1=ys(opt.band[1]),y2=ys(opt.band[0]);
          band='<rect x="'+P+'" y="'+y1+'" width="'+(W-P-8)+'" height="'+Math.max(0,y2-y1)+'" fill="#63c7a61f" rx="4"/><text x="'+(W-14)+'" y="'+(y1+14)+'" text-anchor="end" font-size="9.5" fill="#16785c" font-weight="700">'+opt.bandLabel+'</text>';
        }
        var pline=points.map(function(p,i){return xs(i)+','+ys(p.y)}).join(' ');
        var dots=points.map(function(p,i){return '<circle cx="'+xs(i)+'" cy="'+ys(p.y)+'" r="3.5" fill="#101b35" stroke="#fff" stroke-width="1.5"><title>'+esc(p.x)+'：'+p.y+'</title></circle>'}).join('');
        var xlab=points.map(function(p,i){
          if(points.length>8&&i%Math.ceil(points.length/8)!==0)return '';
          return '<text x="'+xs(i)+'" y="'+(H-12)+'" text-anchor="middle" font-size="9.5" fill="#9aa4b8">'+esc(p.x)+'</text>';
        }).join('');
        return '<svg viewBox="0 0 '+W+' '+H+'" role="img">'+grid+labels+band+
          '<polyline points="'+pline+'" fill="none" stroke="#101b35" stroke-width="2.2" stroke-linejoin="round"/>'+dots+xlab+'</svg>';
      }
      function render(){
        var s={};
        try{s=JSON.parse(localStorage.getItem('usbar-studio-v2')||'{}')||{}}catch(e){}
        var lookup=Object.keys(s.lookupLog||{}).length;
        var q=s.reviewQueue||[];
        var reviewing=q.filter(function(i){return i.status!=='mastered'}).length;
        var mastered=q.filter(function(i){return i.status==='mastered'}).length;
        var readings=(s.readingLog||[]).filter(function(r){return r.verified!==false});
        var streak=streakDays(s);
        var retells=Object.values(s.retellLog||{}).flatMap(function(o){return Object.values(o||{})});
        var accAvg=retells.length?Math.round(retells.reduce(function(a,e){return a+(e&&e.feedback?e.feedback.term_accuracy||0:0)},0)/retells.length):null;

        $('#stats').innerHTML=
          stat('LOOKUPS',lookup+'','查过的词（三源起点）')+
          stat('MASTERED',mastered+'','复习毕业的词',mastered>0?'hot':'')+
          stat('TIMED READS',readings.length+'','有效净读次数')+
          stat('STREAK',streak+' 天','连续学习');
        var pct=lookup?Math.max(4,Math.round(mastered/Math.max(1,lookup)*100)):0;
        $('#pipe').innerHTML='<div class="pipe">'+
          '<div class="pipe-stage" style="background:#eef2fb"><b>'+lookup+'</b><span>查过的词</span></div><div class="pipe-arrow">→</div>'+
          '<div class="pipe-stage" style="background:#fdf3e7"><b>'+reviewing+'</b><span>复习中（SM-2 排队）</span></div><div class="pipe-arrow">→</div>'+
          '<div class="pipe-stage" style="background:#e8f6f0"><b>'+mastered+'</b><span>已毕业（连续答对 5 次）</span></div></div>'+
          (lookup?'<p style="margin:14px 2px 0;font-size:11.5px;color:#6e7890">毕业率 '+pct+'% —— 目标：常查的词最终都进兵器库。</p>':'');

        var byDate={};
        (s.readingLog||[]).forEach(function(r){var d=new Date(r.date||Date.now());var k=(d.getMonth()+1)+'/'+d.getDate();byDate[k]=Math.max(byDate[k]||0,r.wpm)});
        $('#wpm').innerHTML=lineChart(Object.keys(byDate).map(function(k){return {x:k,y:byDate[k]}}),{min:0,max:220,band:[120,150],bandLabel:'MBE 目标 120–150 wpm'});

        var accPts=Object.keys(s.retellLog||{}).map(function(pg){
          var es=Object.values(s.retellLog[pg]||{});
          if(!es.length)return null;
          return {x:'P'+pg,y:Math.round(es.reduce(function(a,e){return a+(e&&e.feedback?e.feedback.term_accuracy||0:0)},0)/es.length)};
        }).filter(Boolean);
        $('#acc').innerHTML=lineChart(accPts,{min:0,max:100,bandLabel:'目标 ≥80'})+
          (accAvg!=null?'<p style="margin:12px 2px 0;font-size:11.5px;color:#6e7890">总体均值 <b style="color:#152344">'+accAvg+'</b> —— 每次 AI 批改后自动更新。</p>':'');

        var arsenal=q.filter(function(i){return i.source==='corrected'});
        $('#arsenalCount').textContent=arsenal.length+' 条 AI 纠正的 native 表达';
        $('#arsenal').innerHTML=arsenal.length?'<div class="arsenal">'+arsenal.map(function(i){
          return '<div class="arsenal-card"><b>'+esc(i.word)+'</b><small>'+(i.type==='chunk'?'表达块':'词')+' · 第 '+(i.page||'?')+' 页复述批改所得</small></div>'}).join('')+'</div>'
          :'<div class="empty">兵器库还是空的——做复述练习后，AI 纠正的 native 表达会自动收进来。</div>';

        var owned=s.badges||[];
        $('#badgeCount').textContent=owned.length+' / '+BADGES.length+' 已解锁';
        $('#badges').innerHTML=BADGES.map(function(b){
          var has=owned.indexOf(b.id)>=0;
          return '<div class="badge-card'+(has?'':' locked')+'"><div class="badge-ico">'+(has?'⚖':'✦')+'</div><div><b>'+esc(b.name)+'</b><span>'+esc(b.desc)+'</span></div></div>'}).join('');
      }
      function syncTag(){
        var C=window.CloudSync,t=$('#syncTag');
        if(!C||!C.configured()){t.textContent='✎ 本地数据（云同步未配置）';return}
        var st=C.status?C.status():'off';
        if(st==='online'){t.textContent='☁ 已同步 '+C.email();t.classList.remove('warn')}
        else if(st==='login'){t.textContent='⚠ 本地数据（未登录，不同步）';t.classList.add('warn')}
        else if(st==='offline'){t.textContent='⚠ 云同步离线（新记录暂存本机）';t.classList.add('warn')}
        else{t.textContent='◌ 正在连接云同步…'}
      }
      render();
      if(window.CloudSync&&window.CloudSync.ready){
        window.CloudSync.ready().then(function(){render();syncTag()});
        window.CloudSync.onStatus(syncTag);
      }
      window.addEventListener('usbar:external-update',render);
    })();
  </script>
</body>
</html>
