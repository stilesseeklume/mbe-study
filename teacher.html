<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>廖同学学习面板 · Teacher View</title>
  <style>
    :root{--navy:#101b35;--navy2:#192b50;--blue:#5f82c8;--peach:#f3b7a9;--paper:#fbfcff;--ink:#18233a;--muted:#6e7890;--line:#dfe5f0;--panel:#f2f5fb;--ok:#16785c}
    *{box-sizing:border-box}
    html,body{margin:0;background:#edf1f8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
    button{font:inherit}
    .bar{position:sticky;top:0;z-index:10;background:linear-gradient(90deg,#0f1b35,#17294e);color:#fff;display:flex;align-items:center;gap:14px;padding:14px 26px;box-shadow:0 10px 30px rgba(10,20,45,.25)}
    .who{display:flex;gap:11px;align-items:center}
    .who img{width:40px;height:40px;border-radius:13px;object-fit:cover;border:1px solid #ffffff55}
    .who b{display:block;font-size:13px}
    .who span{display:block;font-size:10px;color:#94a5c5;letter-spacing:.08em;margin-top:2px}
    .bar-right{margin-left:auto;display:flex;gap:9px;align-items:center}
    .tag{font-size:10.5px;color:#9fe3c8;border:1px solid #9fe3c84d;border-radius:999px;padding:5px 11px}
    .tag.warn{color:#f3b7a9;border-color:#f3b7a94d}
    .bar-right button,.bar-right a{border:1px solid #ffffff24;background:#ffffff0d;color:#dbe4f5;border-radius:10px;padding:8px 13px;font-size:11.5px;cursor:pointer;text-decoration:none;font-weight:700}
    .bar-right button:hover,.bar-right a:hover{background:#ffffff1c}
    main{max-width:1060px;margin:0 auto;padding:30px 22px 90px}
    .gate{max-width:430px;margin:9vh auto;background:var(--paper);border-radius:22px;padding:38px 32px;text-align:center;box-shadow:0 24px 60px rgba(20,35,70,.12)}
    .gate .kicker{font-size:10px;font-weight:900;letter-spacing:.2em;color:var(--blue)}
    .gate h1{font-family:Georgia,"Songti SC",serif;font-size:27px;margin:12px 0 10px;color:#12203e}
    .gate p{font-size:12.5px;line-height:1.8;color:var(--muted);margin:0 0 22px}
    .gate button{border:0;border-radius:12px;background:var(--navy);color:#fff;padding:13px 26px;font-weight:800;font-size:13px;cursor:pointer}
    .gate .hint{margin-top:18px;font-size:10.5px;color:#98a1b5}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:26px}
    .stat{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:19px 19px 16px}
    .stat small{display:block;font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:800;margin-bottom:9px}
    .stat b{display:block;font-family:Georgia,serif;font-size:29px;color:#152344;line-height:1}
    .stat span{display:block;font-size:10.5px;color:var(--muted);margin-top:7px}
    .stat.hot b{color:#16785c}
    section h2{font-family:Georgia,"Songti SC",serif;font-size:19px;margin:30px 0 14px;color:#152344}
    section h2 small{font-family:-apple-system,"PingFang SC",sans-serif;font-size:10.5px;color:var(--muted);font-weight:500;margin-left:8px}
    .feed{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:8px 20px}
    .feed-row{display:flex;gap:13px;align-items:baseline;padding:13px 2px;border-bottom:1px solid #edf0f5;font-size:13px}
    .feed-row:last-child{border-bottom:0}
    .feed-ico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:12px;flex:none;align-self:center}
    .feed-row b{font-size:13px}
    .feed-row span{color:var(--muted);font-size:11px;margin-left:auto;white-space:nowrap}
    .note-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
    .note-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:17px 18px}
    .note-card q{display:block;font-family:Georgia,serif;font-size:12.5px;color:#526079;line-height:1.6;border-left:2px solid var(--peach);padding-left:11px;margin:0 0 11px}
    .note-card p{margin:0;font-size:13.5px;line-height:1.75;color:var(--ink)}
    .note-card small{display:block;margin-top:11px;color:var(--muted);font-size:10.5px}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:12.5px;font-family:Georgia,serif}
    .chip.hot{border-color:#e08a7d;color:#b8472f;background:#fdf0ec}
    .chip small{font-family:-apple-system,"PingFang SC",sans-serif;color:var(--muted);font-size:10px;margin-left:5px}
    .rq-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
    .rq-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
    .rq-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .rq-cols div{border-radius:11px;padding:11px 12px;font-size:12px;line-height:1.65;font-family:Georgia,serif}
    .rq-cols .ans{background:#f4f6fb;color:#526079}
    .rq-cols .rw{background:#e8f6f0;color:#1d5a48}
    .rq-cols h4{margin:0 0 7px;font-family:-apple-system,"PingFang SC",sans-serif;font-size:9.5px;letter-spacing:.1em;color:var(--muted);font-weight:800}
    .rq-foot{display:flex;gap:8px;align-items:center;margin-top:11px;font-size:10.5px;color:var(--muted)}
    .rq-score{margin-left:auto;font-family:Georgia,serif;font-weight:800;font-size:15px;color:#16785c}
    .trend{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:13px 17px;font-size:12px;margin-bottom:13px}
    .trend b{font-family:Georgia,serif;font-size:17px;color:#152344}
    .trend .up{color:#16785c}.trend .down{color:#b8472f}.trend .flat{color:#9aa4b8}
    .mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:13px}
    .read-row{display:flex;gap:10px;align-items:baseline;padding:9px 2px;border-bottom:1px solid #edf0f5;font-size:12.5px}
    .read-row:last-child{border-bottom:0}
    .read-row b{font-family:Georgia,serif;font-size:14px;min-width:52px}
    .read-row .ok{color:#16785c;font-weight:700}
    .read-row .no{color:#b8472f;font-weight:700}
    .read-row span{color:var(--muted);font-size:10.5px}
    .empty{background:var(--paper);border:1px dashed var(--line);border-radius:16px;padding:34px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.8}
    .foot{margin-top:34px;text-align:center;color:#9aa4b8;font-size:10.5px;line-height:1.7}
    @media(max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}.note-grid{grid-template-columns:1fr}.bar{padding:12px 15px}.bar-right a{display:none}}
  </style>
</head>
<body>
  <header class="bar">
    <div class="who"><img src="assets/rising-star.jpg" alt="廖同学"><div><b>廖同学 · 学习面板</b><span>TEACHER VIEW · READ ONLY</span></div></div>
    <div class="bar-right"><span class="tag" id="syncTag">正在连接…</span><button id="refreshBtn">↻ 刷新</button><button id="logoutBtn">⏻ 退出</button><a href="index.html">← 返回学习室</a></div>
  </header>
  <main>
    <div class="gate" id="gate" hidden></div>
    <div id="board" hidden>
      <div class="stats" id="stats"></div>
      <section><h2>学习动态 <small>来自云端 · 每分钟自动刷新</small></h2><div class="feed" id="feed"></div></section>
      <section id="qualitySec"><h2>输出质量 <small>复述原文 vs AI 重写 · 近4周准确率趋势</small></h2><div id="quality"></div></section>
      <section id="speedSec"><h2>校准与速度 <small>三项校准档案 + 净读 wpm 记录</small></h2><div id="speed"></div></section>
      <section id="signalSec"><h2>依赖信号 <small>中文展开与重复查词 · 教学干预线索</small></h2><div id="signals"></div></section>
      <section><h2>全部笔记 <small id="noteCount"></small></h2><div class="note-grid" id="notes"></div></section>
      <section><h2>生词本 <small id="wordCount"></small></h2><div class="chips" id="words"></div></section>
      <div class="foot">数据保存在 Supabase，只有登录账号可以查看。<br>笔记的英文原文可供批改——点「返回学习室」可进入学生视角。</div>
    </div>
  </main>
  <script src="assets/supabase-config.js?v=20260825-t2"></script>
  <script src="assets/cloud-sync.js?v=20260825-t2"></script>
  <script>
    (function () {
      var $ = function (s) { return document.querySelector(s); };
      var C = window.CloudSync;
      var escapeHtml = function (s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c];
        });
      };
      var relTime = function (iso) {
        if (!iso) return '还没有记录';
        var ms = Date.now() - new Date(iso).getTime();
        if (ms < 0) ms = 0;
        var min = Math.floor(ms / 60000);
        if (min < 1) return '刚刚';
        if (min < 60) return min + ' 分钟前';
        if (min < 1440) return Math.floor(min / 60) + ' 小时前';
        return Math.floor(min / 1440) + ' 天前';
      };

      function gate(html) {
        var g = $('#gate');
        g.hidden = false;
        g.innerHTML = html;
        $('#board').hidden = true;
      }

      function showUnconfigured() {
        gate('<div class="kicker">TEACHER VIEW</div><h1>云同步还没配置</h1>' +
          '<p>这个面板读取 Supabase 云端数据。请先按仓库里的 SUPABASE_SETUP.md 完成配置（约 5 分钟），再刷新本页。</p>');
      }

      function showLoginGate() {
        gate('<div class="kicker">TEACHER VIEW</div><h1>请用老师账号登录</h1>' +
          '<p>这个面板是老师专属视角，用于查看廖同学的完成进度、学习动态和全部笔记。</p>' +
          '<button id="gateLogin">登录老师账号</button>' +
          '<div class="hint">学生账号无法查看此面板</div>');
        $('#gateLogin').onclick = function () {
          C.login().then(function () { if (C.isLoggedIn()) boot(); });
        };
      }

      function showDeniedGate() {
        gate('<div class="kicker">TEACHER VIEW</div><h1>此面板仅老师可用</h1>' +
          '<p>当前登录的是学生账号（' + escapeHtml(C.email() || '未知') + '），无法查看老师面板。<br>要在这里查看，请退出后用老师账号登录。</p>' +
          '<button id="gateSwitch">切换账号</button>' +
          '<div class="hint"><a href="index.html" style="color:#5f82c8">← 回到我的学习室</a></div>');
        $('#gateSwitch').onclick = function () { C.logout(); };
      }

      function render(stateRows, events) {
        var state = {};
        (stateRows || []).forEach(function (row) { state[row.key] = row.value; });
        var completed = (state.completed || []).filter(function (n) { return n >= 9 && n <= 16; });
        var notes = (state.notes || []).slice().sort(function (a, b) { return (b.id || 0) - (a.id || 0); });
        var words = state.savedWords || [];
        var activity = state._activity || {};

        $('#stats').innerHTML =
          stat('COMPLETED', (completed.length || 0) + '', '试运行 8 页（宪法第一章）', completed.length ? 'hot' : '') +
          stat('NOTES', notes.length + '', '全部笔记（可批改）') +
          stat('SAVED WORDS', words.length + '', '生词本') +
          stat('LAST ACTIVE', relTime(activity.last_active), '最近一次打开学习室');

        var iconMap = { login: ['⛅', '#e8eefc', '#4a6bb5'], complete: ['✓', '#e4f5ef', '#16785c'], note: ['✎', '#fdeee9', '#b8654f'], word: ['＋', '#fdf6e3', '#9a7a1f'], calibration: ['⏱', '#e9f0fb', '#4a6bb5'], reading: ['⏱', '#e4f5ef', '#16785c'], review: ['↻', '#fdeee9', '#b8654f'] };
        var textMap = { login: '打开了学习室', complete: '完成了一页学习', note: '写了一条新笔记', word: '收藏了一个生词', calibration: '完成了校准测试', reading: '完成了一次净读计时', review: '完成了一轮复习' };
        var feed = $('#feed');
        if (events && events.length) {
          feed.innerHTML = events.slice(0, 40).map(function (ev) {
            var icon = iconMap[ev.kind] || ['•', '#eef1f7', '#6e7890'];
            var detail = ev.detail && ev.detail.text ? '<em style="font-style:normal;color:#8b96ad;font-size:11px">（' + escapeHtml(ev.detail.text) + '）</em>' : '';
            return '<div class="feed-row"><span class="feed-ico" style="background:' + icon[1] + ';color:' + icon[2] + '">' + icon[0] + '</span>' +
              '<b>廖同学</b>&nbsp;' + (textMap[ev.kind] || ev.kind) + detail +
              '<span>' + relTime(ev.created_at) + '</span></div>';
          }).join('');
        } else {
          feed.innerHTML = '<div class="feed-row" style="border:0;color:var(--muted);font-size:12px">暂无动态——廖同学开始学习后，这里会显示她的每一次完成、笔记和收藏。</div>';
        }

        /* —— 输出质量区 —— */
        var retellLog = state.retellLog || {};
        var rqPages = Object.keys(retellLog).sort(function (a, b) { return b - a; });
        var rqCards = rqPages.map(function (pg) {
          var entries = Object.keys(retellLog[pg]).map(function (k) { return retellLog[pg][k]; })
            .sort(function (a, b) { return (b.time || 0) - (a.time || 0); });
          if (!entries.length) return '';
          var e = entries[0], fb = e.feedback || {};
          return '<div class="rq-card"><div class="rq-cols">' +
            '<div class="ans"><h4>她的原文</h4>' + escapeHtml(e.answer || '') + '</div>' +
            '<div class="rw"><h4>AI 重写</h4>' + escapeHtml(fb.rewrite || '—') + '</div>' +
            '</div><div class="rq-foot">第 ' + escapeHtml(pg) + ' 页 · ' + relTime(e.time ? new Date(e.time).toISOString() : '') +
            '<span class="rq-score">' + (fb.term_accuracy != null ? fb.term_accuracy : '—') + '</span></div></div>';
        }).join('');
        var allRetells = [];
        Object.keys(retellLog).forEach(function (pg) {
          Object.keys(retellLog[pg]).forEach(function (k) { allRetells.push(retellLog[pg][k]); });
        });
        var trendHtml = '';
        if (allRetells.length) {
          var buckets = [[], [], [], []];
          allRetells.forEach(function (e) {
            var idx = Math.floor((Date.now() - (e.time || 0)) / (7 * 864e5));
            if (idx >= 0 && idx < 4) buckets[idx].push(e);
          });
          var means = buckets.map(function (list) {
            return list.length ? Math.round(list.reduce(function (a, e) { return a + ((e.feedback && e.feedback.term_accuracy) || 0); }, 0) / list.length) : null;
          });
          var parts = [], prev = null;
          for (var w = 3; w >= 0; w--) {
            if (means[w] == null) continue;
            var arrow = '', cls = 'flat';
            if (prev != null) {
              if (means[w] > prev) { arrow = '▲'; cls = 'up'; }
              else if (means[w] < prev) { arrow = '▼'; cls = 'down'; }
              else arrow = '—';
            }
            parts.push('<span>' + (w === 0 ? '本周' : w + ' 周前') + ' <b>' + means[w] + '</b>' + (arrow ? ' <span class="' + cls + '">' + arrow + '</span>' : '') + '</span>');
            prev = means[w];
          }
          trendHtml = '<div class="trend"><span style="font-weight:800;color:#152344">术语准确率（近4周均值）</span>' + parts.join('') + '</div>';
        }
        $('#quality').innerHTML = rqCards
          ? trendHtml + '<div class="rq-grid">' + rqCards + '</div>'
          : '<div class="empty">还没有复述记录——廖同学完成第一批 AI 批改复述后，这里会对照展示她的原文和 native 重写。</div>';

        /* —— 校准与速度区 —— */
        var profile = state.profile, reads = (state.readingLog || []).slice(-10).reverse();
        var speedHtml = '';
        if (profile) {
          speedHtml += '<div class="mini-stats">' +
            stat('WPM', profile.wpm + '', '校准测速') +
            stat('RETELL', (profile.retellBaseline != null ? profile.retellBaseline : '—') + '', '复述基线') +
            stat('VOCAB', (profile.vocabCoverage != null ? profile.vocabCoverage + '%' : '—'), '法律义项覆盖') +
            stat('CALIBRATED', profile.date ? relTime(new Date(profile.date).toISOString()) : '—', '校准时间') +
            '</div>';
        } else {
          speedHtml += '<div class="empty">还没有校准档案——首次校准后这里显示她的测速、复述基线与词汇覆盖。</div>';
        }
        speedHtml += reads.length
          ? '<div style="background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:8px 20px">' + reads.map(function (r) {
              return '<div class="read-row"><b>' + (r.wpm || 0) + ' wpm</b>' +
                '<span>P' + escapeHtml(String(r.page)) + ' · ' + escapeHtml(String(r.section || '')) + '</span>' +
                (r.verified === false ? '<span class="no">未验证</span>' : '<span class="ok">✓ 已验证</span>') +
                '<span>' + relTime(r.date ? new Date(r.date).toISOString() : '') + '</span></div>';
            }).join('') + '</div>' +
            '<p style="margin:10px 2px 0;font-size:11px;color:var(--muted)">目标带 120–150 wpm（MBE 阅读节奏）；未验证 = 可能扫读，仅参考。</p>'
          : '<div class="empty">还没有净读计时记录。</div>';
        $('#speed').innerHTML = speedHtml;

        /* —— 依赖信号区 —— */
        var zh = (state.zhExpand && state.zhExpand.total) || 0;
        var lookups = Object.keys(state.lookupLog || {}).map(function (w) { return state.lookupLog[w]; })
          .sort(function (a, b) { return (b.count || 0) - (a.count || 0); }).slice(0, 5);
        var signalHtml = '<div class="trend" style="margin-bottom:0"><span style="font-weight:800;color:#152344">中文参考展开</span><b>' + zh + '</b><span style="color:var(--muted)">次——频繁展开提示理解依赖翻译，建议回到英文原文复读。</span></div>';
        signalHtml += lookups.length
          ? '<div class="chips" style="margin-top:13px">' + lookups.map(function (l) {
              var hot = (l.count || 0) >= 3;
              return '<span class="chip' + (hot ? ' hot' : '') + '">' + escapeHtml(l.word) + '<small>查 ' + (l.count || 0) + ' 次' + (hot ? ' · 未习得' : '') + '</small></span>';
            }).join('') + '</div>' +
            '<p style="margin:10px 2px 0;font-size:11px;color:var(--muted)">红色 = 查询 ≥3 次，建议列入课堂重点或让学生用复习队列消化。</p>'
          : '<div class="empty" style="margin-top:13px">还没有查词记录。</div>';
        $('#signals').innerHTML = signalHtml;

        $('#noteCount').textContent = notes.length + ' 条 · 最新在前';
        $('#notes').innerHTML = notes.length
          ? notes.map(function (n) {
              return '<div class="note-card"><q>' + escapeHtml(n.quote) + '</q><p>' + escapeHtml(n.text) + '</p><small>' + escapeHtml(n.time || '') + '</small></div>';
            }).join('')
          : '<div class="empty">还没有笔记。<br>廖同学在学习室里选中任意英文段落即可写笔记，写完会同步到这里。</div>';

        $('#wordCount').textContent = words.length + ' 个';
        $('#words').innerHTML = words.length
          ? words.map(function (w) { return '<span class="chip">' + escapeHtml(w) + '</span>'; }).join('')
          : '<div class="empty">生词本还是空的。</div>';

        $('#gate').hidden = true;
        $('#board').hidden = false;
      }

      function stat(label, value, sub, extra) {
        return '<div class="stat ' + (extra || '') + '"><small>' + label + '</small><b>' + value + '</b><span>' + sub + '</span></div>';
      }

      function load() {
        $('#syncTag').textContent = '正在读取…';
        Promise.all([C.fetchState(), C.fetchEvents()])
          .then(function (result) {
            $('#syncTag').textContent = '已连接 · ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            $('#syncTag').classList.remove('warn');
            render(result[0], result[1]);
          })
          .catch(function (error) {
            $('#syncTag').textContent = '读取失败';
            $('#syncTag').classList.add('warn');
            if (String(error.message || '').indexOf('401') >= 0 || !C.isLoggedIn()) showLoginGate();
          });
      }

      function boot() {
        if (!C.configured()) { showUnconfigured(); return; }
        C.ready().then(function () {
          if (!C.isLoggedIn()) { showLoginGate(); return; }
          if (!C.isTeacher()) { showDeniedGate(); return; }
          load();
          setInterval(function () {
            if (document.visibilityState === 'visible' && C.isLoggedIn() && C.isTeacher()) load();
          }, 60000);
        });
      }

      $('#refreshBtn').onclick = function () {
        if (C.isLoggedIn() && C.isTeacher()) load();
        else boot();
      };

      $('#logoutBtn').onclick = function () { C.logout(); };

      C.onStatus(function (s) {
        if (s === 'login' && !$('#gate').hidden === false) { /* keep current view */ }
      });

      boot();
    })();
  </script>
